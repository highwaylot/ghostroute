    <meta name="description" content="Free, in-browser lessons: write real HTML and CSS and watch it render as you type. Guided steps, debugging puzzles and a full reference. No sign-up." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.tagsmiths.com/" />

    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#0a1440" />
    <!-- Padding for the no-JavaScript fallback only: these selectors match
         the fallback's own header/main, never the app that replaces them. -->
    <style>#root > header, #root > main { padding: 0 16px; }</style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "tagsmiths",
        "url": "https://www.tagsmiths.com/",
        "description": "Free, in-browser lessons: write real HTML and CSS and watch it render as you type.",
        "publisher": { "@type": "Organization", "name": "Fenwick & Vale", "url": "https://fenwickvale.com" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      This is real content, not a loading placeholder — it's replaced the
      instant React mounts, but until then (a crawler without JS, a slow
      connection, JS disabled) it's what actually renders. Using semantic
      tags here isn't optional on a site that teaches people to use them.
    -->
    <div id="root">
      <header>
        <h1>tagsmiths</h1>
        <p>Learn to code by building, one real tag at a time.</p>
      </header>
      <main>
        <p>
          tagsmiths is a live-code HTML learning tool: write real markup in an
          in-browser editor and see it render instantly, with guided steps,
          debugging puzzles, and a full HTML reference.
        </p>
        <noscript>
          <p>The editor runs in your browser and needs JavaScript turned on.</p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
